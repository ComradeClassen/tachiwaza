      - "{uke} circles out of the wrap and recovers to neutral."
      - "{uke} drops his hips and steps back out of the wrap before the lift sets, squaring up."
      - "{uke} drives his weight down off the loaded hip and slides clear, base recovered."
    blocked_by_hip:
      - "{uke} sits his hips back and blocks the load — {tori} can't get under the center."
      - "{uke} jams his hips down against the turn; the load never sets."

