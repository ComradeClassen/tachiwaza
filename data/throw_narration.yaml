# ===========================================================================
# SEOI-NAGE — Shoulder Throw (morote). Tori drops under, loads uke across the
# back/shoulder via the bent arm, and rotates uke over the shoulder.
# Body parts: tori's hip-low drop, tori's pulling/lifting arm under uke's armpit,
# tori's back as the lever, uke's bent-forward posture.
# ===========================================================================
seoi_nage:
  commit:
    - "{tori} commits to Seoi-nage."
    - "{tori} drops his level and spins under — Seoi-nage coming."
    - "{tori} loads the arm and turns in low — Seoi-nage."

  reach_kuzushi:
    clean:
      - "{tori} pulls {uke} forward and up onto the toes, breaking the posture over the front."
      - "{tori}'s sleeve and lapel hands draw {uke}'s weight up and forward off the heels."
      - "{tori} lifts {uke}'s chest forward, floating the balance over the lead foot."
    standard:
      - "{tori} pulls {uke} forward onto the front foot."
      - "{tori} draws {uke}'s weight up and in."
      - "{tori} breaks {uke}'s posture forward."
    sloppy:
      - "{tori} pulls but {uke}'s weight settles back on the heels."
      - "{tori} draws {uke} in without lifting, the posture intact."
      - "{tori} tugs the sleeve late, the forward break incomplete."

  kuzushi:
    clean:
      - "{uke} is lifted onto his toes, chest folding forward over {tori}'s shoulder."
      - "{uke}'s posture breaks forward and up — no base behind him."
      - "{uke} pours forward onto the lead leg, weight rising off the heels."
    standard:
      - "{uke}'s weight rolls forward onto the front foot."
      - "{uke} bends forward as the arms draw him up."
      - "{uke}'s balance lifts forward over the toes."
    sloppy:
      - "{uke} leans in but keeps the heels planted."
      - "{uke} folds at the waist, weight still back."
      - "{uke} drifts forward without rising onto the toes."

  tsukuri:
    clean:
      - "{tori} drops his hips below {uke}'s center and threads his bent arm up under the armpit."
      - "{tori} spins under, back tight to {uke}'s chest, the loading arm hooked high beneath the shoulder."
      - "{tori} sinks low and loads {uke} square across both shoulders, hips well under the center."
    standard:
      - "{tori} drops under and loads {uke} across the back."
      - "{tori} spins in low, the arm hooking under {uke}'s shoulder."
      - "{tori} gets his hips under and loads the shoulder."
    sloppy:
      - "{tori} drops in too high, his hips never clearing under {uke}'s center."
      - "{tori} loads {uke} onto one shoulder, the back turned only halfway in."
      - "{tori}'s arm hooks shallow, catching the biceps instead of deep under the armpit."

  kake:
    clean:
      - "{tori} drives up through the legs and snaps the arms down — {uke} flies over the shoulder and slams flat."
      - "{tori} straightens the hips and rotates {uke} over the top; he comes down clean onto his back."
      - "{tori} bucks {uke} up off the mat and whips him down over the shoulder."
      - "{tori} drops under and drives up, the loading arm snapping {uke} over the shoulder and down off his base."
      - "The hips fire and the shoulder turns — {uke} is lifted over the top with nothing under him."
    standard:
      - "{tori} drives up and turns {uke} over the shoulder."
      - "{tori} straightens the legs and rotates {uke} down."
      - "{tori} snaps the arms down, {uke} rolling over the back."
    sloppy:
      - "{tori} drives up but {uke} slides off the shoulder and posts out."
      - "{tori} snaps the arms without the leg drive — {uke} stalls on the back."
      - "{tori} rotates partway and {uke} steps around to recover."

  failures:
    tori_stuck_with_uke_on_back:
      - "{tori} loads {uke} but can't finish the turn — he's stuck bent over with {uke} dead weight on his back."
      - "The lift stalls at the top; {tori} is pinned under {uke}'s weight, unable to rotate him off."
      - "{tori} gets {uke} up but the rotation dies — now he's carrying {uke} with nowhere to go."
    tori_bent_forward_loaded:
      - "{tori} bends to load but {uke} settles his weight down onto him — {tori} folds forward, loaded and stuck."
      - "{uke} drops his weight onto the loaded back; {tori} is bent forward, pinned under the load."
      - "{tori}'s posture collapses under the weight, folded forward over his own knees."
    stance_reset:
      - "{uke} steps around the turning hip and squares up — Seoi-nage fails."
      - "{uke} pulls his weight back off the shoulder and resets his base."
      - "{uke} circles off the load and recovers to neutral."
      - "{uke} drops his hips and steps around the turn-in before the shoulder loads, squaring up."
      - "{uke} hauls his weight back off the back and slides clear, base recovered."
    tactical_drop_reset:
      - "{tori} drops to a knee for the Seoi but the lift was never there — both reset off the failed entry."
      - "{tori}'s drop-Seoi carried no commitment; {uke} reads the fake and they break apart."
    blocked_by_hip:
      - "{uke} sits back and blocks the hip — {tori} can't get under the center to load."
      - "{uke} jams his hips down against the entry; the shoulder load never sets."

# ===========================================================================
# TAI-OTOSHI — Body Drop. Tori turns in and lays a barrier leg across uke's
