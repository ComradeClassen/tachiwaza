      - "{uke} drifts forward without floating onto one leg."

  tsukuri:
    clean:
      - "{tori} threads his reaping leg up between {uke}'s thighs, the back of the thigh pressed high to {uke}'s inner leg."
      - "{tori}'s sweeping leg drives deep into the gap, hamstring flush against {uke}'s inner thigh."
      - "{tori} loads {uke} onto the hip and sets the reaping leg high inside the supporting thigh."
    standard:
