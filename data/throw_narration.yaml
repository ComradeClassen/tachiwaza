      - "{tori} rotates in late, the circle never opening {uke}'s base."

  kuzushi:
    clean:
      - "{uke} floats up onto the toes of one leg, weight stretched forward into the turn."
      - "{uke}'s balance rises onto the supporting leg, the inner thigh open and loaded."
      - "{uke} is lifted forward and around, the gap between his thighs wide open."
    standard:
      - "{uke}'s weight lifts onto the forward leg."
      - "{uke} rises onto the toes as the turn pulls him around."
      - "{uke}'s balance floats forward into {tori}'s back."
    sloppy:
      - "{uke} leans into the turn but keeps both feet weighted."
