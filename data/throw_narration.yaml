      - "{tori} drops under too early, the foot reaching for the hip."
      - "{tori} plants the foot off-center, the spring angle wrong."

  kake:
    clean:
      - "{tori} extends the leg and rolls back — {uke} is launched over the top in a full circle and slams down."
      - "{tori}'s foot drives {uke}'s hips skyward as the hands steer; {uke} wheels over and crashes flat."
      - "{tori} springs the leg straight and {uke} cartwheels clean over the sacrifice."
      - "{tori} fires the planted foot up and rolls under — {uke} is wheeled over the top in a full arc."
      - "The leg springs straight into {uke}'s hips and he is thrown over the circle, the mat rushing up."
    standard:
      - "{tori} extends the leg and rolls {uke} over the top."
      - "{tori} drives the foot up, {uke} wheeling over."
      - "{tori} rolls back and sends {uke} over in a circle."
    sloppy:
      - "{tori} extends the leg but {uke} posts a hand and stalls over the top."
      - "{tori} rolls back without the foot loaded — {uke} steps across him."
      - "{tori}'s spring fires off-center, {uke} tumbling to the side instead of over."

  failures:
    uke_voluntary_newaza:
      - "{uke} rides the roll down but lands on top, following {tori} to the mat into ne-waza."
      - "{uke} posts out of the circle and drops into {tori}'s guard rather than over the top."
      - "{uke} drops his weight into the sacrifice and the exchange settles to the ground, no throw scored."
    kaeshi_waza_generic:
      - "{uke} reads the sacrifice, steps over the planted foot, and counters {tori} on his back."
      - "{uke} stuffs the roll and passes the leg, turning the throw back on {tori}."
      - "{uke} rides {tori}'s drop and reverses, ending on top."
    stance_reset:
      - "{uke} pulls his hips back off the foot and squares up — Tomoe-nage fails."
      - "{uke} steps clear of the drop and resets to a standing base."
      - "{uke} disengages from the sacrifice and recovers to neutral."
      - "{uke} drives his hips back off the planted foot before the roll fires, and squares up."
      - "{uke} circles wide of the drop and keeps his base, the sacrifice finding no momentum."

# ===========================================================================
# O-GURUMA — Major Wheel. Lever form: tori bars an extended leg across the
# front of uke's body and wheels uke over it like a spoke around an axle.
# Body parts: tori's extended barrier leg (across the thighs/belt), tori's
# rotating hands, uke's forward-pitched posture wheeling over the leg.
# ===========================================================================
o_guruma:
  commit:
    - "{tori} commits to O-guruma."
    - "{tori} bars the leg across and turns in — O-guruma coming."
    - "{tori} extends the wheel leg across {uke}'s front — O-guruma."

  reach_kuzushi:
    clean:
      - "{tori} pulls {uke} forward and up onto the toes, the weight pitching over the front."
      - "{tori}'s hands draw {uke}'s chest forward off the heels, balance riding ahead."
      - "{tori} rotates {uke} forward across the line, loading the front corner."
    standard:
      - "{tori} pulls {uke} forward onto the front foot."
      - "{tori} draws {uke}'s weight ahead over the toes."
      - "{tori} works {uke}'s balance forward into the turn."
    sloppy:
      - "{tori} pulls but {uke}'s weight stays back on the heels."
      - "{tori} draws {uke} in flat, no forward pitch."
      - "{tori} tugs late, the forward load thin."

  kuzushi:
    clean:
      - "{uke} pitches forward onto the toes, weight wheeling ahead over the lead leg."
      - "{uke}'s posture breaks forward and up, balance spilling across the front."
      - "{uke} is drawn up and forward, the base left behind the toes."
    standard:
      - "{uke}'s weight rolls forward over the lead foot."
      - "{uke} tips ahead as the hands draw him in."
      - "{uke}'s balance loads onto the front leg."
    sloppy:
      - "{uke} leans forward but keeps the heel down."
      - "{uke} drifts ahead, weight still centered."
      - "{uke} folds at the waist without loading the front foot."

  tsukuri:
    clean:
      - "{tori} bars his extended leg high across the front of {uke}'s thighs, a long axle to wheel over."
      - "{tori} sweeps the straight leg across {uke}'s belt line and sets it as the spoke."
      - "{tori} plants the wheel leg precisely across {uke}'s hips, body turned away."
    standard:
      - "{tori} bars his leg across the front of {uke}'s thighs."
      - "{tori} lays the extended leg across {uke}'s hips."
      - "{tori} sets the wheel leg against {uke}'s front."
    sloppy:
      - "{tori}'s wheel leg lands low, across the shins instead of the thighs."
      - "{tori} bars the leg short, {uke}'s hips inside the axle."
      - "{tori} lays the leg in late, the wheel angle lost."

  kake:
    clean:
      - "{tori} rotates the hands over the barred leg — {uke} wheels over the axle and slams flat on his back."
      - "{tori} drives {uke}'s upper body across the extended leg; {uke} cartwheels over the spoke and crashes down."
      - "{tori} turns the wheel hard, {uke} rolling clean over the leg onto his back."
      - "{tori} wheels the hands across the bar — {uke} pitches over the extended leg and around the axle."
      - "The barred leg holds as a spoke and {uke} is turned over it, his weight rolling past the point of no return."
    standard:
      - "{tori} wheels {uke} over the barred leg."
      - "{tori} rotates {uke} across the extended leg and down."
      - "{tori} drives {uke} over the axle to the mat."
    sloppy:
      - "{tori} rotates the hands but {uke} steps over the low bar and recovers."
      - "{tori} drives forward without the leg set — {uke} posts and stays up."
      - "{tori}'s wheel stalls, {uke} pulling his hips back over the leg."

  failures:
    tori_bent_forward_loaded:
      - "{tori} commits to the wheel but the rotation dies — he's bent forward over his own barred leg."
      - "{uke} sags his weight onto the axle; {tori} folds forward, the wheel jammed."
      - "{tori}'s posture spills over the extended leg, bent and loaded, the turn stalled."
    kaeshi_waza_generic:
      - "{uke} rides the wheel, steps over the barred leg, and turns the throw back on {tori}."
      - "{uke} reads the axle, clears the leg, and counters as {tori} overcommits the rotation."
      - "{uke} uses {tori}'s wheeling drive against him, redirecting into a counter."
    stance_reset:
      - "{uke} steps over the wheel leg and squares up — O-guruma fails."
      - "{uke} pulls his hips back across the bar and resets his base."
      - "{uke} circles off the axle and recovers to neutral."
      - "{uke} lifts his hips over the barred leg before the wheel turns, and squares up."
      - "{uke} steps back off the spoke and slides clear, base recovered."
    blocked_by_hip:
      - "{uke} sits his hips back and blocks the bar — {tori} can't set the axle across the front."
      - "{uke} jams the hip down against the wheel leg; the spoke never seats."

# ===========================================================================
# SUMI-GAESHI — Corner Reversal. Sacrifice throw: tori drops under, hooks a
# foot inside uke's thigh, and rolls backward, throwing uke over the corner.
# Body parts: tori's hooking instep inside uke's thigh, tori's pulling hands,
# tori's back rolling under, uke's forward-driven weight over the corner.
# ===========================================================================
sumi_gaeshi:
  commit:
    - "{tori} commits to Sumi-gaeshi."
    - "{tori} drops under and hooks inside — Sumi-gaeshi coming."
    - "{tori} sacrifices for the corner, hooking the thigh — Sumi-gaeshi."

  reach_kuzushi:
    clean:
      - "{tori} draws {uke} forward into him, loading the forward weight over the corner."
      - "{tori}'s hands pull {uke}'s chest down and in, momentum flowing toward the drop."
      - "{tori} breaks {uke} forward over the hooking side, weight pitching ahead."
    standard:
      - "{tori} pulls {uke} forward and in."
      - "{tori} draws {uke}'s weight over the corner."
      - "{tori} works {uke}'s momentum forward into the drop."
    sloppy:
      - "{tori} pulls but {uke}'s weight stays back, no forward load."
      - "{tori} draws {uke} in flat, the corner never loaded."
      - "{tori} tugs late, {uke}'s weight uncommitted."

  kuzushi:
    clean:
      - "{uke} is drawn forward and down over the corner, weight pouring onto the hooked side."
      - "{uke}'s posture breaks forward over the hooking leg, the base trailing behind."
      - "{uke} pitches forward into {tori}, weight flooding over the corner."
    standard:
      - "{uke}'s weight rolls forward over the hooked side."
      - "{uke} bends forward into the pull."
      - "{uke}'s balance loads onto the corner."
    sloppy:
      - "{uke} leans forward but holds his base, weight checked."
      - "{uke} drifts in without committing the weight."
      - "{uke} keeps upright, the corner load missing."

  tsukuri:
    clean:
      - "{tori} drops under and hooks his instep deep inside {uke}'s thigh, the foot loaded to lift."
      - "{tori} sits low and threads the hooking foot inside the thigh, knee tucked to spring the corner."
      - "{tori} rolls under, the instep set high inside {uke}'s leg, hands steering the corner."
    standard:
      - "{tori} drops under and hooks inside {uke}'s thigh."
      - "{tori} threads the hooking foot inside the leg."
      - "{tori} sits low, instep set inside the thigh."
    sloppy:
      - "{tori}'s hook lands low on the knee, not up inside the thigh."
      - "{tori} drops under early, the hooking foot reaching for the thigh."
      - "{tori} sets the hook shallow, the corner angle off."

  kake:
    clean:
      - "{tori} lifts the hooked leg and rolls back — {uke} is thrown over the corner and slams onto his back."
      - "{tori}'s instep drives {uke}'s thigh up as the hands turn him; {uke} flips over the corner and lands flat."
      - "{tori} springs the hook and wheels {uke} clean over the corner to the mat."
      - "{tori} drives the hooked instep up and rolls under — {uke} is turned over the corner in a full arc."
      - "The hook lifts the thigh as the hands steer and {uke} flips across the corner, the mat coming up fast."
    standard:
      - "{tori} lifts the hook and rolls {uke} over the corner."
      - "{tori} drives the instep up, {uke} turning over."
      - "{tori} rolls back and throws {uke} over the corner."
    sloppy:
      - "{tori} lifts the hook but {uke} posts a hand and stalls over the corner."
      - "{tori} rolls back without the hook loaded — {uke} sprawls across him."
      - "{tori}'s spring fires off-line, {uke} tumbling to the side."

  failures:
    uke_voluntary_newaza:
      - "{uke} rides the roll down and lands on top, following {tori} into ne-waza."
      - "{uke} posts out of the corner and settles into {tori}'s guard rather than over it."
      - "{uke} drops his weight into the sacrifice and the exchange goes to the ground, no throw scored."
    kaeshi_waza_generic:
      - "{uke} reads the corner, frees the hooked leg, and reverses {tori} onto his back."
      - "{uke} stuffs the roll, passes the hook, and turns the throw back on {tori}."
      - "{uke} rides {tori}'s drop and counters, ending on top."
    stance_reset:
      - "{uke} pulls the hooked leg free and squares up — Sumi-gaeshi fails."
      - "{uke} steps clear of the drop and resets to a standing base."
      - "{uke} disengages from the corner and recovers to neutral."
