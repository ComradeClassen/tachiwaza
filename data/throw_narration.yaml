  kake:
    clean:
      - "{tori} straightens the legs, lifts {uke} clear off the mat, and rotates him over the hip onto his back."
      - "{tori} bucks the hips up and turns the waist — {uke} rolls over the top and slams flat."
      - "{tori} lifts and twists, {uke} cartwheeling over the loaded hip."
      - "{tori} drives the hips up under the load and turns — {uke} comes off the mat and over the top."
