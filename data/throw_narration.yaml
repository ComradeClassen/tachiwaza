# Throw narration data — HAJ-223 authoring (body-part lexicon).
#
# Populated for the 13 engine-implemented throws (those in
# THROW_TO_TECHNIQUE_ID with worked_throws physics profiles). Keys are
# the ThrowID enum name lowered (throw_narration._throw_key_for), NOT the
# technique_id string — e.g. ThrowID.O_SOTO_GARI -> `o_soto_gari`.
#
# Audited against src/availability.py THROW_TO_TECHNIQUE_ID + src/worked_throws.py
# on 2026-06-05. The ticket's original 13 named ko_soto_gari / ippon_seoi_nage /
# tsuri_komi_goshi, none of which are engine-implemented; the live set
# substitutes harai_goshi_classical / tomoe_nage / o_guruma (the Lever forms).
#
# Schema:
#   <throw_id_lowered>:
#     commit:    ["..."]                              # flat list (3 variants)
#     reach_kuzushi: {clean: [...], standard: [...], sloppy: [...]}
#     kuzushi:       {clean: [...], standard: [...], sloppy: [...]}
#     tsukuri:       {clean: [...], standard: [...], sloppy: [...]}
#     kake:          {clean: [...], standard: [...], sloppy: [...]}
#     failures:
#       <failure_outcome_lowered>: ["..."]            # FailureOutcome enum, lowered
#
# Failure keys per throw are its FailureSpec primary/secondary/tertiary
# (src/worked_throws.py), plus blocked_by_hip for hip-loaders and
# tactical_drop_reset for drop variants where the engine can route there.
#
# {tori}/{uke} are substituted with live fighter names at render time
# (throw_narration.render_line). Use them, never literal names.

# ===========================================================================
# O-SOTO-GARI — Major Outer Reap. Tori steps alongside uke, drives the
# head/chest back over the heel, and reaps the loaded leg from outside.
# Body parts: tori's reaping leg, tori's lapel hand driving uke's chest,
# uke's loaded rear leg / heel, uke's collapsing posture.
# ===========================================================================
o_soto_gari:
  commit:
    - "{tori} commits to O-soto-gari."
    - "{tori} steps deep alongside {uke}, loading for the outer reap — O-soto-gari."
    - "{tori} drives the lapel hand up under {uke}'s chin — O-soto-gari coming."

  reach_kuzushi:
    clean:
      - "{tori} drives {uke}'s chest back, stacking the weight onto one heel."
      - "{tori}'s lapel hand pushes up and back — {uke}'s head travels past his rear foot."
      - "{tori} steps his lead foot deep past {uke}'s and tips the upper body backward."
    standard:
      - "{tori}'s lapel hand presses up under the jaw, walking {uke}'s weight back toward the heel."
      - "{tori} steps alongside, the sleeve hand pinning the arm as he drives the chest rearward."
      - "{tori}'s collar grip works {uke}'s posture back, hunting the moment the heel takes the load."
    sloppy:
      - "{tori} shoves at the lapel but his elbow's bent — the push dies before it reaches {uke}'s spine."
      - "{tori} steps in shallow, the chest-hand sliding off without driving {uke} off the heel."
      - "{tori} grabs high on the collar and leans, his own weight tipping in ahead of the push."

  kuzushi:
    clean:
      - "{uke}'s weight pours onto the rear leg — that heel is now the only support."
      - "{uke} arches back, the loaded leg stiffening as the balance breaks rearward."
      - "{uke}'s head drops behind his heel — the posture is gone."
    standard:
      - "{uke}'s weight rolls back onto the rear leg."
      - "{uke} leans away from the pressure, the back leg taking the load."
      - "{uke}'s base shifts rearward as the chest gives ground."
    sloppy:
      - "{uke} sways back but keeps a foot free to post."
      - "{uke}'s weight shifts without fully committing to the rear leg."
      - "{uke} bends at the waist instead of tipping — base intact."

  tsukuri:
    clean:
      - "{tori} swings his reaping leg up high and tight behind {uke}'s loaded knee."
      - "{tori} plants his support foot past {uke} and hangs the reaping leg behind the calf."
      - "{tori}'s hamstring lands flush against the back of {uke}'s thigh, ready to scythe."
    standard:
      - "{tori} brings his reaping leg up behind {uke}'s leg."
      - "{tori} steps his support foot in and cocks the sweeping leg back."
      - "{tori} hooks his leg in behind the loaded knee."
    sloppy:
      - "{tori}'s reaping leg arrives low, catching {uke} at the ankle instead of the thigh."
      - "{tori} plants his support foot too far out, the reap stretched thin."
      - "{tori} swings the leg in late, behind the loaded knee by a beat."

  kake:
    clean:
      - "{tori} scythes the leg back and up — {uke}'s support is gone and he crashes flat on his back."
      - "{tori}'s hamstring drives through the thigh, the chest-hand finishing the rotation — clean O-soto."
      - "{tori} reaps hard, {uke}'s loaded leg whipping skyward as he slams down."
      - "{tori}'s reaping leg scythes the heel out from under {uke} as the lapel hand drives the chest back."
      - "The loaded leg is swept clean and {uke} pitches backward over the lost heel."
    standard:
      - "{tori} reaps the leg out and drives {uke} down."
      - "{tori} sweeps the loaded leg back, {uke} toppling rearward."
      - "{tori} drives the chest hand through as the reap lands."
    sloppy:
      - "{tori}'s reap drags across the calf, {uke} hopping to keep the foot down."
      - "{tori} sweeps without the chest drive — {uke} folds but doesn't fly."
      - "{tori}'s leg catches but the upper body stalls, the throw losing its turn."

  failures:
    tori_compromised_forward_lean:
      - "{tori} reaps hard but his own weight chases past the support foot — he pitches forward, posture gone."
      - "{tori}'s upper body overcommits over the reaping leg; he stumbles in over {uke}."
      - "{tori} leans through the throw and ends up bent over his own lead foot, off balance."
    osoto_gaeshi:
      - "{uke} feels the reap coming, hops the loaded leg clear, and reaps {tori}'s post — O-soto-gaeshi."
      - "{uke} rides the backward push, swings his own leg through, and counters with O-soto-gaeshi."
      - "{uke} catches {tori}'s reaping leg mid-swing and turns it back on him."
    stance_reset:
      - "{uke} steps the rear leg back out of the reap and squares up — O-soto-gari fails."
      - "{uke} recovers his heel, slides off the line, and resets to a neutral stance."
      - "{uke} circles his weight back over both feet before the leg can be loaded."
      - "{uke} lifts the loaded leg clear the instant the reap swings — {tori}'s hamstring finds only air."
      - "{uke} slips his heel off the line a beat early and the outer reap scythes through nothing."
    blocked_by_hip:
      - "{uke} jams his hip in and blocks the entry — {tori} can't get the reaping leg past."
      - "{uke} turns his hip across the line; the reap finds the hip, not the leg."

# ===========================================================================
# O-UCHI-GARI — Major Inner Reap. Tori hooks from inside and reaps uke's
# far leg out wide while driving the weight back and across.
# Body parts: tori's reaping (hooking) leg, tori's hands steering the chest,
# uke's far leg, uke's widening base.
# ===========================================================================
o_uchi_gari:
  commit:
    - "{tori} commits to O-uchi-gari."
    - "{tori} steps inside and angles {uke} back — O-uchi-gari coming."
    - "{tori} drives between {uke}'s feet, hunting the far leg — O-uchi-gari."

  reach_kuzushi:
    clean:
      - "{tori} drives {uke}'s weight back and across, splitting the stance open."
      - "{tori} steps in deep between the feet, his hands carrying {uke}'s chest rearward."
      - "{tori} angles {uke} onto the far heel, the base spreading wide."
    standard:
      - "{tori} steps inside and presses {uke}'s weight back."
      - "{tori} works between the feet, pushing the chest rearward."
      - "{tori} drives in, widening {uke}'s stance."
    sloppy:
      - "{tori} steps inside but the weight stays over {uke}'s lead foot."
      - "{tori} pushes flat into the chest without splitting the base."
      - "{tori} crowds in close, the angle never opening."

  kuzushi:
    clean:
      - "{uke}'s far leg loads as the weight rolls back and out — the base is split."
      - "{uke} settles onto the inside edge of the far foot, stretched wide and rearward."
      - "{uke}'s stance spreads, the far heel pinned under his own weight."
    standard:
      - "{uke}'s weight shifts onto the far leg."
      - "{uke} leans back as the stance widens."
      - "{uke}'s base spreads, the far foot taking load."
    sloppy:
      - "{uke} widens but keeps his weight floating between both feet."
      - "{uke} shifts back without loading the far leg."
      - "{uke} absorbs the push, base wide but balanced."

  tsukuri:
    clean:
      - "{tori} hooks his reaping leg deep around the inside of {uke}'s far knee."
      - "{tori} slides his calf behind {uke}'s loaded leg, the hook set high and tight."
      - "{tori}'s instep catches the inside of the far heel, ready to sweep it out wide."
    standard:
      - "{tori} hooks his leg inside {uke}'s far leg."
      - "{tori} reaches the reaping leg around the loaded knee."
      - "{tori} sets the hook behind the far leg."
    sloppy:
      - "{tori}'s hook lands shallow, catching the shin instead of behind the knee."
      - "{tori} reaches the leg in late, the far foot already drifting."
      - "{tori}'s reaping leg slips off the inside of the knee."

  kake:
    clean:
      - "{tori} sweeps the far leg out wide and drives the chest back — {uke}'s base splits out from under him."
      - "{tori}'s hook scythes the loaded leg away; {uke} drops backward with nothing under him."
      - "{tori} reaps the inside leg out and rides {uke} down to the mat."
      - "{tori} drives the weight across as the hook clears the far foot — {uke} folds backward off the lost leg."
      - "The far leg is swept wide and {uke}'s spine tips back over the gap where his base used to be."
    standard:
      - "{tori} sweeps the far leg out and drives {uke} back."
      - "{tori} reaps the loaded leg, {uke} dropping rearward."
      - "{tori} hooks the leg away and follows {uke} down."
    sloppy:
      - "{tori}'s hook drags the far foot a few inches but {uke} hops it back under."
      - "{tori} sweeps without the rearward drive — {uke} staggers but stays up."
      - "{tori}'s reap loses the leg halfway, the foot sliding free."

  failures:
    tori_compromised_single_support:
      - "{tori} commits to the hook and ends up stranded on one leg, {uke} still standing."
      - "{tori}'s support foot is all he has left — the reap missed and he's balanced on a single leg."
      - "{tori} hangs on the reaping leg too long; his own base collapses to one point."
      - "{uke} snatches the far leg back as the hook arrives — {tori}'s reap closes on nothing and strands him on one foot."
    stance_reset:
      - "{uke} steps the far leg out of the hook and squares his stance — O-uchi-gari fails."
      - "{uke} pulls the loaded leg free and resets over both feet."
      - "{uke} circles off the reap and recovers a neutral base."
      - "{uke} whips the far leg back out of the hook before the reap connects — the sweep finds empty mat."
      - "{uke} reads the inside reap and lifts the leg clear on time, leaving {tori}'s hook chasing air."
    partial_throw:
      - "{tori} drags {uke} down partway but the reap dies before the back hits — a scrambling half-throw."
      - "{uke} goes down to a hip, not a back — the O-uchi only half lands."
      - "{tori} gets the leg out but {uke} catches himself on a hand on the way down."
    tactical_drop_reset:
      - "{tori}'s entry never had the weight behind it — the inner reap was a feint, and both reset."
      - "{tori} drops into the hook with nothing committed; {uke} reads it and they break apart."

# ===========================================================================
# KO-UCHI-GARI — Minor Inner Reap. Tori pins uke's lead foot and sweeps the
# heel forward, collapsing the leg backward. (Ticket reference example,
# adapted to {tori}/{uke} and engine failure keys.)
# Body parts: tori's stepping/sweeping foot, tori's body angle, uke's lead
# leg / heel, uke's base of support.
# ===========================================================================
ko_uchi_gari:
  commit:
    - "{tori} commits to Ko-uchi-gari."
    - "{tori} loads to fire — Ko-uchi-gari coming."
    - "{tori} lowers level and angles in — Ko-uchi-gari."

  reach_kuzushi:
    clean:
      - "{tori}'s sleeve hand drives {uke}'s weight onto the lead leg, pinning the heel to the mat."
      - "{tori} steps in tight, the lapel grip pressing {uke} back onto a loading front foot."
      - "{tori} angles in, the hands stacking {uke}'s weight over the heel he means to sweep."
    standard:
      - "{tori} steps in and works the sleeve, pressing {uke} back onto the lead foot."
      - "{tori} closes the distance, the grip walking {uke}'s weight toward the front heel."
      - "{tori} pushes in behind the hands, hunting the loaded lead leg."
    sloppy:
      - "{tori}'s sleeve hand jerks {uke} forward, but his own feet trail behind the pull."
      - "{tori} digs the lapel grip in and leans, weight tipping ahead of his hips."
      - "{tori} reaches in with the hands but never sets his base — the pull has no floor under it."

  kuzushi:
    clean:
      - "{uke}'s weight rolls onto the back of his heel — balance compromised."
      - "{uke}'s lead leg loads — the foot pinned to the mat."
      - "{uke} lifts the rear foot to recover and exposes the front."
    standard:
      - "{uke}'s stance shifts as his lead leg loads."
      - "{uke}'s weight transfers backward onto the lead foot."
      - "{uke} adjusts his base but the lead leg is committed."
    sloppy:
      - "{uke} sways but stays on his base."
      - "{uke}'s stance wobbles slightly."
      - "{uke} shifts weight without committing the lead leg."

  tsukuri:
    clean:
      - "{tori} slides his sweeping foot behind {uke}'s lifted heel."
      - "{tori}'s sweeping foot arrives at {uke}'s heel, sole flat."
      - "{tori} places his foot perfectly — behind, low, ready to sweep."
    standard:
      - "{tori} steps his foot in low, between {uke}'s stance."
      - "{tori} positions the sweeping foot toward {uke}'s lead leg."
      - "{tori}'s sweeping foot lines up with the target heel."
    sloppy:
      - "{tori}'s positioning foot doesn't quite reach behind {uke}'s heel."
      - "{tori}'s foot lands shallow — too far in front of the target."
      - "{tori} rushes the step-in, foot landing imprecisely."

  kake:
    clean:
      - "{tori} sweeps the planted leg out from under {uke}."
      - "{tori}'s sole drives the heel forward — {uke}'s leg lifts clean."
      - "The sweep catches the heel perfectly — {uke} collapses backward."
      - "{tori}'s sole clips the heel forward and the lead leg folds — {uke} drops backward off the lost base."
      - "The planted foot is swept out clean and {uke} pitches back into the space where it stood."
    standard:
      - "{tori} sweeps the planted leg."
      - "{tori} drives his foot through, sweeping the heel."
      - "{tori} completes the sweep, foot following through."
    sloppy:
      - "{tori}'s foot drags across the mat, catching {uke}'s heel awkwardly."
      - "{tori}'s sweep loses power before contact."
      - "{tori} rakes the foot across without clean contact."

  failures:
    tori_sweep_bounces_off:
      - "{tori}'s foot meets {uke}'s leg but bounces off — {uke} keeps his base."
      - "{uke}'s lead foot is too planted — the sweep redirects off the heel."
      - "{tori}'s sweep contacts but fails to dislodge the foot."
    stance_reset:
      - "{uke} shifts weight, regaining stance — Ko-uchi-gari fails."
      - "{uke} recovers the lead foot, sliding back to neutral."
      - "{uke} adjusts in time — the sweep finds empty space."
      - "{uke} lifts the lead foot off the mat the instant the sweep comes — {tori}'s sole skims past nothing."
      - "{uke} pulls the heel back out of the sweep's path and squares up before it lands."
    partial_throw:
      - "{tori} clips the heel and {uke} stumbles down to a knee, not his back."
      - "{uke} loses the foot but catches himself on a post — only half down."
      - "The sweep half-lands; {uke} sprawls and scrambles rather than falling clean."
    tactical_drop_reset:
      - "{tori}'s step-in carried no real weight — the sweep was a probe, and they reset."
      - "{tori} feints the Ko-uchi without committing; {uke} reads it and resets."

# ===========================================================================
# DE-ASHI-HARAI — Forward Foot Sweep. Pure timing: tori sweeps uke's advancing
# foot at the instant before it's weighted, sweeping it across.
# Body parts: tori's sweeping sole, tori's hands steering the rhythm,
# uke's advancing foot, uke's transferring weight.
# ===========================================================================
de_ashi_harai:
  commit:
    - "{tori} commits to De-ashi-harai."
    - "{tori} times {uke}'s step — De-ashi-harai."
    - "{tori} reads the rhythm and loads the sweep — De-ashi-harai coming."

  reach_kuzushi:
    clean:
      - "{tori} steers {uke} into a step and waits for the foot to float."
      - "{tori}'s hands draw {uke} sideways, baiting the advancing foot off the mat."
      - "{tori} matches {uke}'s rhythm, hunting the instant the foot is unweighted."
    standard:
      - "{tori} works {uke} into a step, looking for the sweep."
      - "{tori} draws {uke} sideways, watching the feet."
      - "{tori} pulls on the rhythm, waiting for the advancing foot."
    sloppy:
      - "{tori} reaches for the rhythm but {uke}'s step is already planted."
      - "{tori} tugs without setting the timing, the feet out of sync."
      - "{tori} hunts the foot but mistimes {uke}'s cadence."

  kuzushi:
    clean:
      - "{uke}'s advancing foot floats, unweighted for a heartbeat — the moment is there."
      - "{uke} steps and his weight hangs between the feet, the lead foot light."
      - "{uke}'s foot skims forward, the sole barely grazing the mat."
    standard:
      - "{uke}'s foot comes forward, weight in transit."
      - "{uke} steps and his balance rides between the feet."
      - "{uke}'s advancing foot lightens as he moves."
    sloppy:
      - "{uke}'s foot is already settling, the weight half-committed."
      - "{uke} steps but plants quickly, the window closing."
      - "{uke}'s foot touches down before the load lifts."

  tsukuri:
    clean:
      - "{tori}'s sole arrives at {uke}'s ankle, flat and low, perfectly on time."
      - "{tori} lays the bottom of his foot against the outside of {uke}'s advancing foot."
      - "{tori}'s sweeping foot meets the target the instant it floats."
    standard:
      - "{tori} brings his sole to {uke}'s advancing foot."
      - "{tori} sets the sweeping foot against the ankle."
      - "{tori}'s foot lines up with the moving foot."
    sloppy:
      - "{tori}'s sole arrives a beat late, the foot already loading."
      - "{tori} reaches the foot in too high, catching the shin."
      - "{tori}'s sweeping foot lands behind the target, chasing it."

  kake:
    clean:
      - "{tori} sweeps the foot across the mat — {uke}'s legs scissor out and he drops flat."
      - "{tori}'s sole whips the floating foot sideways; {uke} crashes down, swept clean."
      - "The sweep takes the foot out from under the step — {uke} lands on his side, flat."
      - "{tori}'s sole catches the foot at the float and brushes it across — {uke}'s legs tangle and the base is gone."
      - "The advancing foot is swept sideways mid-step and {uke} spills off the lost line."
    standard:
      - "{tori} sweeps the foot across, {uke} falling sideways."
      - "{tori} brushes the foot away and {uke} goes down."
      - "{tori} drives the sole through, sweeping the leg out."
    sloppy:
      - "{tori}'s sweep clips the foot late, {uke} hopping to recover."
      - "{tori} brushes the foot but the weight's already down — no sweep."
      - "{tori}'s sole skids off the ankle, the timing gone."

  failures:
    tori_sweep_bounces_off:
      - "{tori}'s sole meets a planted foot and bounces — {uke} was already weighted."
      - "The sweep hits a loaded leg and rebounds; nothing moves."
      - "{tori}'s foot glances off {uke}'s ankle without taking it."
    stance_reset:
      - "{uke} plants the foot and squares up — the timing's gone, De-ashi fails."
      - "{uke} settles his step and resets, the window closed."
      - "{uke} catches the rhythm break and recovers his base."
      - "{uke} sets the advancing foot down a beat early — the sweep skims a loaded sole and dies."
      - "{uke} checks the step short and pulls the foot back, leaving {tori}'s sole hunting empty mat."
    partial_throw:
      - "{tori} clips the foot enough to stagger {uke}, but he hops down to a knee and scrambles."
      - "{uke} loses the foot but posts a hand — only half swept."
      - "The sweep half-lands; {uke} sprawls instead of falling flat."

# ===========================================================================
# HARAI-GOSHI — Sweeping Hip Throw. Tori turns in, loads uke onto the hip,
# and sweeps the thigh/leg up the front of uke's leg as the hands rotate.
# Body parts: tori's sweeping leg/thigh, tori's pulling arms, tori's loaded hip,
# uke's bent-forward posture, uke's near leg.
# ===========================================================================
harai_goshi:
  commit:
    - "{tori} commits to Harai-goshi."
    - "{tori} turns in and loads the hip — Harai-goshi coming."
    - "{tori} spins in deep, sweeping leg cocked — Harai-goshi."

  reach_kuzushi:
    clean:
      - "{tori} pulls {uke} up onto his toes and forward, breaking the posture over the front."
      - "{tori}'s arms draw {uke}'s chest forward and up, lifting the weight onto the lead foot."
      - "{tori} rotates in, dragging {uke} forward across the hip line."
    standard:
      - "{tori} pulls {uke} forward and turns in."
      - "{tori} draws {uke}'s weight onto the front foot."
      - "{tori} spins in, working {uke}'s balance forward."
    sloppy:
      - "{tori} turns in but {uke}'s weight stays back on the heels."
      - "{tori} pulls without lifting, {uke} still flat-footed."
      - "{tori} rotates in late, the forward break incomplete."

  kuzushi:
    clean:
      - "{uke} is dragged up onto his toes, chest forward, weight pouring over the front leg."
      - "{uke}'s posture breaks forward — he's stretched over {tori}'s hip with no base behind."
      - "{uke} tips forward onto the lead leg, the heel lifting off the mat."
    standard:
      - "{uke}'s weight rolls forward onto the lead leg."
      - "{uke} bends forward as the arms draw him in."
      - "{uke}'s balance shifts onto the front foot."
    sloppy:
      - "{uke} leans forward but keeps the heels down."
      - "{uke} bows at the waist, weight still centered."
      - "{uke} drifts forward without fully loading the front leg."

  tsukuri:
    clean:
      - "{tori} loads {uke} high onto his hip and lays the sweeping thigh across the front of {uke}'s leg."
      - "{tori}'s hip drives under {uke}'s center, the sweeping leg pressed up against the thigh."
      - "{tori} turns in tight, backside into {uke}, the reaping leg set along {uke}'s thigh."
    standard:
      - "{tori} loads {uke} onto the hip and brings the sweeping leg across."
      - "{tori} sets his hip under {uke} and lays the leg in."
      - "{tori} turns in and plants the sweeping thigh against {uke}'s leg."
    sloppy:
      - "{tori}'s hip lands low under {uke}, the sweeping leg reaching too far down."
      - "{tori} turns in shallow, his backside never clearing under {uke}'s center."
      - "{tori}'s sweeping leg arrives across the shin, not the thigh."

  kake:
    clean:
      - "{tori} sweeps the leg up and rotates the arms over — {uke} cartwheels across the hip and slams down."
      - "{tori}'s thigh whips {uke}'s leg skyward as the hands turn him over — clean Harai-goshi."
      - "{tori} drives the sweep up the thigh and spins {uke} flat onto his back."
      - "{tori}'s sweeping thigh lifts the leg away as the hands wheel over — {uke} is turned off his base and over the hip."
      - "The leg is swept up the front and {uke} rotates across the loaded hip, the mat coming up to meet him."
    standard:
      - "{tori} sweeps the leg up and turns {uke} over the hip."
      - "{tori} drives the thigh up and rotates {uke} down."
      - "{tori} completes the sweep, {uke} rolling over the hip."
    sloppy:
      - "{tori}'s sweep catches low, {uke} stepping over the leg to recover."
      - "{tori} turns the hands but the leg sweep stalls — {uke} posts off."
      - "{tori}'s thigh drags up the leg without lift, the rotation dying."

  failures:
    tori_compromised_single_support:
      - "{tori} sweeps the leg up but {uke} doesn't go — now {tori}'s stranded on one leg, hip exposed."
      - "The sweep finds air; {tori} hangs on his support leg with {uke} still planted."
      - "{tori} commits the sweeping leg and ends up balanced on a single foot, {uke} riding it out."
    tori_compromised_forward_lean:
      - "{tori} over-rotates and pitches forward off the hip, posture spilling past his support."
      - "{tori}'s upper body chases the throw past his base — he stumbles forward, bent over."
      - "{tori} leans through the sweep and ends up folded over his own lead foot."
    stance_reset:
      - "{uke} steps around the sweeping leg and squares up — Harai-goshi fails."
      - "{uke} drops his weight back off the hip and resets his base."
      - "{uke} circles out of the load and recovers a neutral stance."
      - "{uke} steps his swept leg back down before the thigh can lift it, and squares up."
      - "{uke} sags his hips off the load and slides clear of the sweep, base recovered."
    blocked_by_hip:
      - "{uke} jams his own hip down and blocks the load — {tori} can't get under the center."
      - "{uke} sinks his hips and stuffs the entry; the sweep never gets its fulcrum."

# ===========================================================================
# UCHI-MATA — Inner Thigh Throw. Tori turns in and sweeps the inner thigh of
# uke's supporting/forward leg up and back as the hands lift and rotate.
# Body parts: tori's sweeping leg (inner thigh contact), tori's lifting arms,
# tori's loaded hip, uke's posture, uke's inner thigh / supporting leg.
# ===========================================================================
uchi_mata:
  commit:
    - "{tori} commits to Uchi-mata."
    - "{tori} turns in and splits the stance — Uchi-mata coming."
    - "{tori} spins in deep, reaping leg threading the gap — Uchi-mata."

  reach_kuzushi:
    clean:
      - "{tori} draws {uke} forward and around in a circle, floating the weight onto the far leg."
      - "{tori}'s hands lift {uke} up onto the toes, swinging the balance forward and across."
      - "{tori} rotates {uke} into the turn, the weight rising onto a single forward leg."
    standard:
      - "{tori} pulls {uke} forward into the turn."
      - "{tori} draws {uke} around, lifting the weight up."
      - "{tori} spins in, working {uke}'s balance forward."
    sloppy:
