      - "{tori}'s sweep slots in late, {uke}'s leg already drifting clear."

  kake:
    clean:
      - "{tori} sweeps the inner thigh up and back, lifts with the hands — {uke} is launched over the hip."
      - "{tori}'s leg whips {uke}'s supporting leg skyward; the rotation spins {uke} flat onto his back."
      - "{tori} drives the reap up the inner thigh and turns {uke} clean over the top."
      - "{tori}'s sweeping leg lifts the supporting thigh away as the hands turn — {uke} floats up off his base and over."
      - "The inner thigh is reaped skyward and {uke} wheels across the hip with nothing left under him."
    standard:
      - "{tori} sweeps the inner thigh up and rotates {uke} over."
      - "{tori} drives the reaping leg up and turns {uke} down."
      - "{tori} lifts and sweeps, {uke} rolling over the hip."
    sloppy:
      - "{tori}'s sweep catches low and {uke} steps the leg down to recover."
      - "{tori} lifts the hands but the leg reap stalls — {uke} posts out."
      - "{tori}'s reap slides up without lift, the throw losing its turn."

  failures:
    tori_compromised_single_support:
      - "{tori} sweeps high but {uke} stays planted — {tori}'s left hopping on his support leg."
      - "The reaping leg finds air; {tori} hangs on one foot with {uke} still grounded."
      - "{tori} commits the sweep and strands himself on a single support, {uke} riding it down to neither."
    uchi_mata_sukashi:
      - "{uke} reads the uchi-mata, slips his swept leg out, and lets {tori} spin through empty — sukashi."
      - "{uke} pulls the inner leg clear and rides {tori}'s own rotation down — Uchi-mata-sukashi."
