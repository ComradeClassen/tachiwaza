    name_english: One-Hand Drop
    family: te_waza
    subfamily: rear_throw
    kodokan_status: shinmeisho_no_waza
    # Book p.100 #347: "Quickly grab his right leg, either from the inside
    # with your right hand or from the outside with your left." Two distinct
    # grip configurations, not mirrors of each other — both valid in
    # right-stance and authored separately per HAJ-213.
    canonical_grip_signatures:
      - tori_required_grips:
          - hand: tori_right
            target_region: uke_lapel_high
            minimum_depth: controlled
        uke_disqualifying_grips: []
      - tori_required_grips:
          - hand: tori_left
            target_region: uke_leg_outer
            minimum_depth: controlled
        uke_disqualifying_grips: []
    admissible_kuzushi_vectors:
